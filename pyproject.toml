[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwp-scanner"
version = "0.4.0"
description = "Daily CWP market structure scanner for the S&P 500 and CSI 300"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "baostock>=0.8.9",
  "lxml>=5.0",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "requests>=2.31",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cwp-scan = "scanner.scanner:main"

[tool.setuptools]
packages = ["data", "engine", "scanner", "watchlist", "notification", "parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
