scanner:
  min_bars: 180
  cache_refresh_days: 10
  max_workers: 4
  watchlist_max_trading_days: 15
  output_none: false
  engine_mode: v1.8.5-source-port

hs300_download:
  overlap_calendar_days: 45
  adjustment_tolerance: 0.000001
  retry_count: 2
  retry_backoff_seconds: 1.0
  socket_timeout_seconds: 30.0
  progress_interval: 25

notifications:
  telegram_enabled: true
  email_enabled: false
  immediate_change_types:
    - NEW_ENTRY
    - READY_TO_ENTRY
    - NEW_READY
    - WATCH_TO_READY
