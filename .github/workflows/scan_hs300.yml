name: Scan HS300

on:
  workflow_dispatch:
    inputs:
      force_full_download:
        description: Refresh the complete qfq history for every HS300 constituent
        required: false
        type: boolean
        default: false
  schedule:
    # 08:30 UTC is 16:30 China Standard Time, after the A-share close.
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: cwp-hs300
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=(--market hs300 --bars 800 --notify)
          if [[ "${{ inputs.force_full_download }}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%u)" == "5" ]]; then
            args+=(--force-full-download)
          fi
          python -m scanner.scanner "${args[@]}"

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs300-scan-${{ github.run_id }}
          path: |
            output/
            logs/
          retention-days: 14

      - name: Commit state and cache
        if: success()
        run: |
          git config user.name "CWP Scanner Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache/ output/ state/
          git diff --cached --quiet || git commit -m "data: update HS300 scan"
          git pull --rebase
          git push

